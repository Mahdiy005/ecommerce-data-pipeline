version: 2

models:
  - name: int_valid_order_items

    description: >
      Valid order-item records with existing order and product
      references, ready for use in downstream fact models.

    columns:
      - name: order_item_id
        description: Unique identifier for each valid order item.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Identifier of the valid related order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        description: Identifier of the valid related product.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        description: Number of product units in the order item.

      - name: unit_price
        description: Unit price of the product at the time of the order.

      - name: discount_pct
        description: Discount percentage applied to the order item.

      - name: line_total
        description: Final amount for the order-item line.

      - name: warehouse_code
        description: Code of the warehouse fulfilling the order item.