version: 2

models:
  - name: stg_order_items

    description: >
      Cleaned order-item data. Missing order-item identifiers are
      replaced with deterministic generated identifiers. All rows are
      retained for classification in the intermediate layer.

    columns:
      - name: order_item_id
        description: >
          Unique identifier for the order item. A deterministic
          surrogate identifier is generated when the source value is null.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: >
          Identifier of the related order. Its validity is checked
          in int_order_items_classified.

      - name: product_id
        description: >
          Identifier of the related product. Its validity is checked
          in int_order_items_classified.

      - name: quantity
        description: Number of product units in the order item.

      - name: unit_price
        description: Unit price of the product at the time of the order.

      - name: discount_pct
        description: Discount percentage applied to the order item.

      - name: line_total
        description: Final amount for the order-item line.

      - name: warehouse_code
        description: Code of the warehouse fulfilling the order item.