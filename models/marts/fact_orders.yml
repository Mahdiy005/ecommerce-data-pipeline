version: 2

models:
  - name: fct_orders
    description: One row per valid order.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key