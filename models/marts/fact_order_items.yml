version: 2

models:
  - name: fact_order_items
    description: One row per valid order item.

    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique

      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key

      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

      - name: order_date_key
        data_tests:
          # - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key